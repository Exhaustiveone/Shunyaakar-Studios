# Netlify settings. No build step: the site is served as-is from the repo root.
[build]
  publish = "."

# Netlify blocks a deploy if any environment variable's value appears in the files.
# These two aren't secret (the project URL is public by design, the email is just the
# desk's username), so they're skipped. SUPABASE_SERVICE_KEY and any other key
# are still scanned.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,ADMIN_EMAIL"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The desk is private: keep it out of search engines and out of iframes.
[[headers]]
  for = "/desk/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-store"

# Repo files that aren't part of the website.
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/supabase/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/BACKEND.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true
